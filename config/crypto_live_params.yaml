# Parámetros del módulo cripto. Mismo formato que config/live_params.yaml (acciones),
# con las diferencias que importan para un mercado que cotiza 365 días/año y es
# varias veces más volátil que los ETFs de EE.UU.:
#
#   - periods_per_year: 365, no 252 (afecta CAGR/Sharpe/anualización de vol reportados
#     y el escalado de la volatilidad objetivo -- ver src/metrics.py).
#   - momentum_long/short y rebalance_rule en días/reglas de CALENDARIO, no hábiles.
#   - vol_target y reference_vol mucho más altos (cripto es intrínsecamente más volátil).
#   - costos base más altos (fee spot de Binance ~0.1% = 10bps, vs ~3bps en ETFs líquidos).
#   - SIN estimación de impuestos por defecto: el tratamiento fiscal de cripto varía
#     demasiado por país (y es poco claro/cambiante en México) para una aproximación
#     simple -- consulta a un contador de tu país, no uses el módulo genérico de EE.UU.

periods_per_year: 365

momentum:
  fast: 20
  slow: 100
  vol_target: 0.20        # 20% anualizado -- deliberadamente bajo comparado con la
                            # volatilidad real de cripto (BTC solo ya ronda 50-80%),
                            # para que la exposición efectiva sea conservadora por defecto
  vol_lookback: 20
  periods_per_year: 365
  multi_horizon_windows: [30, 91, 182, 365]  # ~1, 3, 6, 12 meses en días de calendario (cripto cotiza todos los días)

mean_reversion:
  trend_sma: 100
  entry_rsi: 15.0
  exit_rsi: 70.0
  max_hold_days: 10
  stop_loss_pct: 0.10       # más ancho que en acciones -- el ruido intradía de cripto
                              # dispararía un stop de 6% constantemente
  max_concurrent_positions: 4
  weight_per_position: 0.08
  vol_lookback: 20
  reference_vol: 0.50        # volatilidad "típica" de cripto, no la de un ETF
  periods_per_year: 365

sector_rotation:
  top_n: 3
  max_weight_per_asset: 0.35
  momentum_long: 365          # días de CALENDARIO (cripto cotiza todos los días)
  momentum_short: 30
  rebalance_rule: "ME"         # fin de mes de calendario, no fin de mes hábil

allocation:
  momentum: 0.45
  mean_reversion: 0.20
  sector_rotation: 0.35

position_caps:
  major_coin: 0.30
  altcoin: 0.15

regime_filter:
  enabled: true
  sma_window: 100              # ~3.3 meses -- los ciclos de cripto son más rápidos que los de acciones
  full_exposure_above_pct: 0.0
  floor_below_pct: -0.25       # cripto se aleja más de su media que un índice de acciones
  min_scale: 0.30

costs:
  use_liquidity_costs: true
  base_capital: 1000
  base_spread_bps: 10.0         # ~0.1% fee spot de Binance
  impact_coeff: 25.0
  max_cost_bps: 80.0

tax:
  estimate_enabled: false       # ver nota arriba -- no hay una aproximación simple honesta para cripto

execution:
  max_slippage_pct: 0.01        # 1% -- spreads más anchos que en ETFs líquidos de EE.UU.
  min_weight_drift: 0.02        # banda de no-operación -- ver comentario en config/live_params.yaml

# Vol-targeting a nivel de PORTAFOLIO completo (ver src/ensemble.py ->
# apply_portfolio_vol_target) -- overlay adicional sobre el ensamble ya
# combinado. vol_target más alto que en acciones (20% vs 10%), coherente con
# el vol_target de momentum arriba y con periods_per_year: 365.
portfolio_vol_target:
  enabled: true
  vol_target: 0.20
  vol_lookback: 20
  max_gross_exposure: 1.0   # nunca apalanca por encima de esto, solo reduce exposición

# Overlays de portafolio (ver src/portfolio_overlays.py). Nota honesta sobre
# cash_sweep_enabled en cripto: a diferencia de BIL (que sí tiene retorno real
# de T-Bills), quote_currency (USDT) es una serie sintética PLANA -- barrer
# capital ocioso hacia USDT no cambia ningún número del backtest (0% igual que
# quedarse "fuera"), solo hace explícito en los reportes/dashboard cuánto
# quedó en stablecoin en vez de invertido. dynamic_caps_enabled SÍ tiene efecto
# real: aprieta los topes quando el universo cripto entero se mueve muy
# correlacionado (común en risk-off generalizado).
portfolio_overlays:
  cash_sweep_enabled: true
  dynamic_caps_enabled: true
  corr_window: 60
  full_cap_below: 0.3
  floor_above: 0.7
  min_scale: 0.6
  ramp_in_enabled: true
  ramp_max_daily_increase: 0.02

# Blackout de FOMC (ver src/event_blackout.py y config/macro_calendar.yaml) --
# no hay blackout de earnings en cripto (no hay "reportes trimestrales" por
# moneda), así que esa parte no aplica acá.
event_blackout:
  fomc_blackout_enabled: true
